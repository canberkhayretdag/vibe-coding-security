name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning scripts/*.sh tests/*.sh
      - name: Tests
        run: bash tests/test_find_secrets.sh
